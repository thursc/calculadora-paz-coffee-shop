<!DOCTYPE html>
<html lang="pt-BR" class="dark overflow-x-hidden w-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paz Coffee Shop - Calculadora de Equipe</title>
    <!-- Tailwind CSS com suporte a Dark Mode via classe -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=1.6.0">
</head>

<body
    class="min-h-screen flex flex-col text-stone-900 dark:text-stone-100 bg-[#faf7f2] dark:bg-[#100f0e] transition-colors duration-200 font-sans overflow-x-hidden w-full max-w-full relative">

    <!-- ========================================================
         CABEÇALHO / BARRA DE COMANDOS EXECUTIVA
         ======================================================== -->
    <header
        class="sticky top-0 z-30 backdrop-blur-md bg-white/95 dark:bg-[#141211]/95 border-b border-stone-200/80 dark:border-stone-800/80 shadow-xs transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 sm:py-3 flex flex-wrap md:flex-nowrap items-center justify-between gap-3">
            <!-- Marca: Logo + Paz Coffee Shop sempre por extenso -->
            <div class="flex items-center gap-2.5 min-w-0 order-1">
                <img src="assets/logo.svg" alt="Paz Coffee Shop Logo" class="logo-img h-8 sm:h-9 w-auto flex-shrink-0">
                <div class="flex items-baseline gap-2">
                    <h1
                        class="font-black text-base sm:text-lg tracking-tight text-stone-900 dark:text-stone-50 whitespace-nowrap">
                        Paz Coffee Shop
                    </h1>
                    <span class="hidden xl:inline-block text-[10px] font-bold tracking-wider uppercase px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
                        Equipe
                    </span>
                </div>
            </div>

            <!-- Centro: Barra de Busca Integrada (em linha única no desktop, linha 2 no mobile) -->
            <div class="order-3 md:order-2 w-full md:w-auto md:flex-grow md:max-w-xs lg:max-w-sm xl:max-w-md md:mx-4">
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="employee-search" placeholder="Buscar colaborador..."
                        class="w-full pl-9 pr-10 md:pr-14 py-2 bg-stone-100/80 dark:bg-stone-900/90 border border-stone-200 dark:border-stone-800 rounded-xl text-sm text-stone-900 dark:text-stone-100 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all shadow-2xs">
                    <!-- Atalho visual de teclado no desktop -->
                    <div class="hidden md:flex absolute inset-y-0 right-0 pr-2.5 items-center pointer-events-none">
                        <kbd class="px-1.5 py-0.5 text-[10px] font-semibold text-stone-400 dark:text-stone-500 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-md shadow-2xs">Ctrl K</kbd>
                    </div>
                    <button type="button" id="clear-search-btn"
                        class="absolute inset-y-0 right-0 md:right-11 pr-2.5 flex items-center text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 hidden cursor-pointer"
                        aria-label="Limpar busca">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Direita: Ações (Alternador de Layout Desktop + Modo Escuro/Claro + Adicionar) -->
            <div class="flex items-center gap-2 flex-shrink-0 order-2 md:order-3">

                <!-- Switch de Modo Escuro / Claro -->
                <button type="button" id="theme-toggle"
                    class="p-2 rounded-xl bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-600 dark:text-amber-400 border border-stone-200 dark:border-stone-700 transition-colors cursor-pointer"
                    title="Alternar Modo Claro/Escuro" aria-label="Alternar tema">
                    <!-- Sol (visível no modo escuro) -->
                    <svg class="sun-icon w-4 h-4 sm:w-5 sm:h-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <!-- Lua (visível no modo claro) -->
                    <svg class="moon-icon w-4 h-4 sm:w-5 sm:h-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>

                <!-- Botão Adicionar Funcionário -->
                <button type="button" id="add-employee"
                    class="flex items-center gap-1.5 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-stone-950 font-bold px-3 py-2 rounded-xl shadow-sm transition-all active:scale-95 text-xs sm:text-sm cursor-pointer"
                    aria-label="Adicionar colaborador">
                    <svg class="w-4 h-4 stroke-[3]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span>Adicionar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ========================================================
         ÁREA PRINCIPAL: ESTEIRA MÓVEL (MOBILE) | GRADE (DESKTOP)
         ======================================================== -->
    <main class="flex-grow flex flex-col pt-2 md:pt-4 w-full max-w-full overflow-hidden md:overflow-visible min-w-0">
        <!-- Container: Esteira horizontal no mobile, Grade fluida no desktop via CSS -->
        <div id="employee-container"
            class="kanban-track flex flex-row items-start gap-4 sm:gap-6 overflow-x-auto pb-8 pt-2 px-4 sm:px-6 w-full max-w-full min-w-0 flex-grow">
            <!-- Cards de funcionários são inseridos dinamicamente aqui -->

            <!-- Card Tracejado de Adicionar no Final da Fila -->
            <div id="add-employee-card"
                class="kanban-col add-card-placeholder w-[85vw] sm:w-[340px] min-w-[310px] max-w-[360px] flex-shrink-0 snap-start">
                <button type="button" id="add-employee-card-btn"
                    class="w-full h-full min-h-[380px] sm:min-h-[420px] border-2 border-dashed border-stone-300 dark:border-stone-800 hover:border-amber-500 dark:hover:border-amber-500 rounded-2xl p-6 flex flex-col items-center justify-center gap-3 bg-stone-100/40 dark:bg-stone-900/40 hover:bg-amber-50/50 dark:hover:bg-stone-900 transition-all cursor-pointer group text-center"
                    aria-label="Adicionar colaborador na esteira">
                    <div
                        class="w-12 h-12 rounded-full bg-stone-200 dark:bg-stone-800 text-stone-700 dark:text-amber-400 group-hover:bg-amber-500 group-hover:text-stone-950 flex items-center justify-center text-2xl font-bold shadow-sm transition-all group-hover:scale-110">
                        +
                    </div>
                    <div>
                        <span class="text-base font-bold text-stone-800 dark:text-stone-200 block">Adicionar
                            Colaborador</span>
                        <span class="text-xs text-stone-500 dark:text-stone-400 mt-1 block">Incluir novo membro da
                            equipe</span>
                    </div>
                </button>
            </div>
        </div>
    </main>

    <!-- Rodapé Discreto -->
    <footer
        class="py-4 text-center text-stone-400 dark:text-stone-600 text-xs border-t border-stone-200/50 dark:border-stone-900/50">
        <p>Paz Coffee Shop &bull; Desenvolvido por Arthur Campos</p>
    </footer>

    <!-- ========================================================
         MODAL: HOLERITE DE PAGAMENTO (WHATSAPP)
         ======================================================== -->
    <div id="holerite-modal"
        class="modal pointer-events-none fixed inset-0 flex items-center justify-center opacity-0 z-50 p-4"
        role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-overlay fixed inset-0 bg-black/65 backdrop-blur-md"></div>
        <div
            class="modal-container relative bg-white dark:bg-[#1a1715] w-full max-w-lg mx-auto rounded-2xl shadow-2xl z-10 overflow-hidden border border-stone-200 dark:border-stone-800 max-h-[90vh] flex flex-col">
            <div class="modal-content p-5 sm:p-6 flex flex-col flex-grow overflow-y-auto text-left">
                <div class="flex justify-between items-center pb-3 border-b border-stone-200 dark:border-stone-800">
                    <div>
                        <h3 class="text-lg sm:text-xl font-bold text-stone-900 dark:text-stone-100">Holerite de
                            Pagamento</h3>
                        <p class="text-xs text-stone-500 dark:text-stone-400">Texto pronto para enviar no WhatsApp do
                            colaborador</p>
                    </div>
                    <button type="button"
                        class="modal-close-btn p-1.5 rounded-lg text-stone-400 hover:text-stone-800 dark:hover:text-stone-100 hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors"
                        aria-label="Fechar modal">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <div class="my-4 flex-grow">
                    <textarea id="holerite-text"
                        class="w-full h-64 p-3.5 border border-stone-200 dark:border-stone-700 rounded-xl bg-stone-50 dark:bg-stone-900 text-stone-800 dark:text-stone-100 font-mono text-xs sm:text-sm leading-relaxed focus:ring-2 focus:ring-amber-500 focus:outline-none resize-none"
                        readonly></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-stone-200 dark:border-stone-800">
                    <button type="button"
                        class="modal-close-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">
                        Fechar
                    </button>
                    <button type="button" id="copy-holerite-btn"
                        class="flex items-center gap-1.5 px-5 py-2.5 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-stone-950 font-bold rounded-xl shadow-md transition-all active:scale-95 text-xs sm:text-sm">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        Copiar Texto
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================================
         MODAL: CONFIRMAÇÃO DE EXCLUSÃO
         ======================================================== -->
    <div id="delete-confirm-modal"
        class="modal pointer-events-none fixed inset-0 flex items-center justify-center opacity-0 z-50 p-4"
        role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-overlay fixed inset-0 bg-black/65"></div>
        <div
            class="modal-container relative bg-white dark:bg-[#1a1715] w-full max-w-sm mx-auto rounded-2xl shadow-2xl z-10 overflow-hidden border border-stone-200 dark:border-stone-800">
            <div class="modal-content p-5 sm:p-6 text-left">
                <div class="flex justify-between items-center pb-3 border-b border-stone-200 dark:border-stone-800">
                    <h3 class="text-lg font-bold text-stone-900 dark:text-stone-100">Confirmar Exclusão</h3>
                    <button type="button"
                        class="modal-close-btn p-1.5 rounded-lg text-stone-400 hover:text-stone-800 dark:hover:text-stone-100 hover:bg-stone-100 dark:hover:bg-stone-800 active:scale-90 transition-all cursor-pointer"
                        aria-label="Fechar modal">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <p id="delete-confirm-text" class="my-4 text-sm text-stone-600 dark:text-stone-300">Tem certeza que
                    deseja excluir este colaborador?</p>
                <div class="flex justify-end gap-2 pt-2 border-t border-stone-200 dark:border-stone-800">
                    <button type="button"
                        class="modal-close-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-800 active:scale-95 transition-all cursor-pointer">Cancelar</button>
                    <button type="button" id="confirm-delete-btn"
                        class="px-4 py-2 bg-red-600 hover:bg-red-500 active:scale-95 rounded-xl text-white font-semibold text-xs sm:text-sm shadow-sm transition-all cursor-pointer"
                        title="Confirmar exclusão">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================================
         TEMPLATE DO CARD DE FUNCIONÁRIO (COLUNA KANBAN)
         ======================================================== -->
    <template id="employee-template">
        <div
            class="kanban-col employee-card-details w-[85vw] sm:w-[340px] min-w-[310px] max-w-[360px] flex-shrink-0 snap-start bg-white dark:bg-[#1a1715] border border-stone-200 dark:border-stone-800 rounded-2xl shadow-sm transition-all flex flex-col" style="overflow:clip">
            <!-- Cabeçalho do Card (Resumo e Ações) -->
            <div
                class="employee-summary p-3.5 sm:p-4 bg-stone-50/70 dark:bg-stone-900/40 flex flex-col gap-2.5">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 flex-grow min-w-0">
                        <span
                            class="w-7 h-7 rounded-full bg-amber-500/15 text-amber-700 dark:text-amber-400 font-bold text-xs flex items-center justify-center flex-shrink-0 border border-amber-500/20">
                            ☕
                        </span>
                        <input type="text"
                            class="employee-name text-base font-bold bg-transparent border-b border-transparent focus:border-amber-500 px-1 py-0.5 text-stone-900 dark:text-stone-50 placeholder-stone-400 dark:placeholder-stone-500 w-full focus:outline-none truncate"
                            placeholder="Colaborador">
                    </div>

                    <!-- Botões Rápidos de Ação do Card -->
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <button type="button"
                            class="reset-btn p-1.5 rounded-lg hover:bg-stone-200 dark:hover:bg-stone-800 text-stone-400 hover:text-amber-600 dark:hover:text-amber-400 transition-colors"
                            title="Resetar Turnos e Eventos" aria-label="Resetar escala">
                            <svg class="w-4 h-4" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <g transform="translate(2 2)">
                                    <path d="m4.5 1.5c-2.41 1.38-4 4.02-4 7 0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8" />
                                    <path d="m4.5 5.5v-4h-4" />
                                </g>
                            </svg>
                        </button>
                        <button type="button"
                            class="remove-employee p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/30 text-stone-400 hover:text-red-600 dark:hover:text-red-400 active:scale-90 transition-all cursor-pointer"
                            title="Excluir Colaborador" aria-label="Excluir colaborador">
                            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Conteúdo do Card (Taxa Horária, Turnos, Dobradinha, Adicionais) -->
            <div class="employee-content px-3.5 sm:px-4 flex flex-col gap-4" role="region">
                <!-- Campo de Valor/Hora Compacto -->
                <div
                    class="flex items-center justify-between bg-stone-100/70 dark:bg-stone-900 px-3 py-1.5 rounded-xl border border-stone-200 dark:border-stone-800">
                    <span class="text-xs font-medium text-stone-500 dark:text-stone-400">Taxa Horária:</span>
                    <div class="flex items-center gap-1">
                        <input type="text" inputmode="decimal" data-type="currency"
                            class="hourly-rate w-24 text-right font-bold text-sm bg-transparent border-0 text-stone-900 dark:text-stone-100 focus:ring-0 p-0"
                            value="R$ 20,00">
                    </div>
                </div>

                <!-- Seção 1: Turnos da Semana (Toggle Pills) -->
                <div>
                    <h4 class="text-[11px] font-bold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-2">
                        Turnos Trabalhados
                    </h4>
                    <div class="shifts-container space-y-2">
                        <!-- Chips dos turnos inseridos via JS em coluna única e legível -->
                    </div>
                </div>

                <!-- Seção 2: Bônus Dobradinha Domingo -->
                <div>
                    <div class="dobradinha-pill flex items-center justify-between p-2.5 rounded-xl border border-stone-200 dark:border-stone-800 bg-stone-50/60 dark:bg-stone-800/30 cursor-pointer select-none"
                        data-bonus="dobradinha" title="Adiciona R$ 50,00 quando escalado manhã e noite no domingo">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" class="bonus-dobradinha-checkbox sr-only" disabled>
                            <span
                                class="dobradinha-indicator w-4 h-4 rounded-full border border-stone-300 dark:border-stone-600 flex items-center justify-center flex-shrink-0">
                                <svg class="w-2.5 h-2.5 hidden text-emerald-500" viewBox="0 0 20 20"
                                    fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                        clip-rule="evenodd" />
                                </svg>
                            </span>
                            <div class="flex flex-col">
                                <span
                                    class="text-xs font-semibold text-stone-800 dark:text-stone-200 leading-tight">Dobradinha
                                    de Domingo</span>
                                <span class="text-[10px] text-stone-400">Manhã + Noite</span>
                            </div>
                        </div>
                        <span
                            class="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">+R$
                            50,00</span>
                    </div>
                </div>

                <!-- Seção 3: Adicionais / Eventos Especiais -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <h4 class="text-[11px] font-bold uppercase tracking-wider text-stone-500 dark:text-stone-400">
                            Adicionais / Eventos</h4>
                        <button type="button"
                            class="add-event-btn px-2 py-0.5 rounded-lg text-xs font-bold bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-700 dark:text-amber-400 border border-stone-200 dark:border-stone-700 transition-colors flex items-center gap-1"
                            aria-label="Adicionar adicional">
                            <span>+ Adicionar</span>
                        </button>
                    </div>
                    <div class="event-list space-y-2">
                        <!-- Itens de adicionais inseridos via JS -->
                    </div>
                </div>
            </div>

            <!-- Rodapé Sempre Visível: Total Individual, Botão Gerar Holerite e Detalhamento -->
            <div class="employee-footer p-3.5 sm:p-4 mt-auto flex flex-col gap-2.5">
                <div class="flex items-center justify-between">
                    <span
                        class="text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider">Total
                        a Pagar:</span>
                    <span
                        class="employee-total text-2xl font-black text-amber-600 dark:text-amber-400 tracking-tight">R$
                        0,00</span>
                </div>

                <button type="button"
                    class="generate-holerite-btn w-full flex items-center justify-center gap-2 py-2.5 px-3 bg-stone-900 hover:bg-stone-800 dark:bg-stone-800 dark:hover:bg-stone-700 text-white font-bold rounded-xl text-xs sm:text-sm shadow-sm transition-all active:scale-95">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                    <span>Gerar Holerite</span>
                </button>

                <!-- Detalhamento dos Cálculos -->
                <details class="calculation-details text-center">
                    <summary
                        class="cursor-pointer text-[11px] text-stone-500 dark:text-stone-400 hover:text-amber-600 dark:hover:text-amber-400 inline-block transition-colors">
                        Ver cálculo detalhado</summary>
                    <div
                        class="details-content mt-2 p-2.5 bg-stone-50 dark:bg-stone-900/60 rounded-xl border border-stone-200 dark:border-stone-800 text-xs flex flex-col gap-2 text-left">
                        <div
                            class="empty-breakdown-message text-center text-stone-400 dark:text-stone-500 py-0.5 text-xs">
                            Nenhum turno ou adicional marcado nesta semana.
                        </div>
                        <div class="shifts-breakdown-container hidden">
                            <span
                                class="font-bold text-stone-700 dark:text-stone-300 block text-[11px] leading-tight">Turnos:</span>
                            <ul
                                class="shifts-breakdown-list list-disc list-inside text-stone-600 dark:text-stone-400 pl-1 space-y-0.5 mt-0.5">
                            </ul>
                        </div>
                        <div class="events-breakdown-container hidden">
                            <span
                                class="font-bold text-stone-700 dark:text-stone-300 block text-[11px] leading-tight">Adicionais:</span>
                            <ul
                                class="events-breakdown-list list-disc list-inside text-stone-600 dark:text-stone-400 pl-1 space-y-0.5 mt-0.5">
                            </ul>
                        </div>
                        <div class="bonus-breakdown-container hidden">
                            <span
                                class="font-bold text-stone-700 dark:text-stone-300 block text-[11px] leading-tight">Bônus:</span>
                            <ul
