<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custos - Paz Coffee Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <img src="assets/logo.svg" alt="Logo Paz Coffee Shop" class="w-full max-w-[120px] md:max-w-[132px] mx-auto h-auto">
            <p class="text-xl text-gray-600 mt-2">Calculadora Interativa de<br>Custos de Mão de Obra</p>
        </header>

        <main class="bg-white p-4 sm:p-6 rounded-2xl shadow-lg">
            <div class="flex flex-wrap justify-between items-center mb-6 border-b pb-4 gap-4">
                <h2 class="text-2xl font-semibold">Quadro de Funcionários</h2>
                <button type="button" id="add-employee" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                    Adicionar Funcionário
                </button>
            </div>

            <div id="employee-container" class="space-y-4">
                <!-- Cards de funcionários são inseridos aqui -->
            </div>

            <div class="mt-8 pt-6 border-t-2 border-dashed">
                <div class="flex justify-end items-center">
                    <span class="text-xl sm:text-2xl font-semibold text-gray-700 mr-4">Custo Total Semanal:</span>
                    <span id="total-cost" class="text-3xl sm:text-4xl font-bold text-orange-600">R$ 0,00</span>
                </div>
            </div>
        </main>
        
        <footer class="text-center mt-8 text-gray-500 text-sm">
            <p>Desenvolvido para Ruth e a equipe da Paz Coffee Shop.</p>
        </footer>
    </div>
    
    <!-- Modal Holerite -->
    <div id="holerite-modal" class="modal pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center opacity-0 z-50" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-xl mx-auto rounded-lg shadow-lg z-50 overflow-y-auto max-h-[90vh]">
            <div class="modal-content py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3 border-b">
                    <p class="text-2xl font-bold">Demonstrativo de Pagamento</p>
                    <button type="button" class="modal-close-btn cursor-pointer z-50 text-3xl leading-none text-gray-500 hover:text-gray-800" aria-label="Fechar modal">&times;</button>
                </div>
                <div class="my-5">
                    <textarea id="holerite-text" class="w-full h-64 p-3 border border-gray-300 rounded-md bg-gray-50 font-mono text-sm leading-relaxed" readonly></textarea>
                </div>
                <div class="flex justify-end pt-2">
                    <button type="button" id="copy-holerite-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors">
                        Copiar Texto
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Confirmação de Exclusão -->
    <div id="delete-confirm-modal" class="modal pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center opacity-0 z-50" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-lg shadow-lg z-50 overflow-y-auto">
            <div class="modal-content py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3 border-b">
                    <p class="text-2xl font-bold text-gray-800">Confirmar Exclusão</p>
                    <button type="button" class="modal-close-btn cursor-pointer z-50 text-3xl leading-none text-gray-500 hover:text-gray-800" aria-label="Fechar modal">&times;</button>
                </div>
                <p id="delete-confirm-text" class="my-5 text-gray-700">Você tem certeza?</p>
                <div class="flex justify-end pt-2 gap-2">
                    <button type="button" class="modal-close-btn px-4 py-2 bg-gray-100 rounded-lg text-gray-700 hover:bg-gray-200 transition-colors">Cancelar</button>
                    <button type="button" id="confirm-delete-btn" class="px-4 py-2 bg-red-500 rounded-lg text-white font-semibold hover:bg-red-600 transition-colors">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Template do Card de Funcionário -->
    <template id="employee-template">
        <div class="employee-card-details bg-gray-50 rounded-xl border border-gray-200 shadow-sm">
            <div class="employee-summary flex justify-between items-center p-4 gap-4 rounded-xl hover:bg-gray-100 transition-colors duration-150">
                <input type="text" class="employee-name text-xl font-semibold bg-transparent focus:bg-white focus:ring-2 focus:ring-orange-500 rounded-md p-2 w-full min-w-0" placeholder="Nome do Funcionário">
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button type="button" class="minimize-btn p-2 rounded-full hover:bg-gray-200" title="Minimizar/Expandir" aria-label="Minimizar ou expandir funcionário">
                        <svg class="w-5 h-5 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                        </svg>
                    </button>
                    <button type="button" class="reset-btn p-2 rounded-full hover:bg-gray-200" title="Resetar Turnos e Eventos" aria-label="Resetar turnos e eventos">
                        <svg class="w-5 h-5 text-gray-600" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                            <g transform="translate(2 2)">
                                <path d="m4.5 1.5c-2.4138473 1.37729434-4 4.02194088-4 7 0 4.418278 3.581722 8 8 8s8-3.581722 8-8-3.581722-8-8-8"/>
                                <path d="m4.5 5.5v-4h-4"/>
                            </g>
                        </svg>
                    </button>
                    <button type="button" class="remove-employee p-2 rounded-full hover:bg-red-100 text-red-500 hover:text-red-700 flex items-center justify-center" title="Excluir Funcionário" aria-label="Excluir funcionário">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="employee-content p-5 border-t border-gray-200" role="region">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Valor/Hora (R$)</label>
                        <input type="text" inputmode="decimal" data-type="currency" class="hourly-rate w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent" value="R$ 15,00">
                    </div>
                </div>

                <div class="space-y-4 mt-4">
                    <div class="shifts-section bg-white rounded-lg p-3 border">
                        <h4 class="text-md font-semibold text-gray-700 mb-2">Turnos Trabalhados</h4>
                        <div class="shifts-container grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
                    </div>

                    <div class="bonus-section bg-white rounded-lg p-3 border">
                        <h4 class="text-md font-semibold text-gray-700 mb-2">Bônus Aplicáveis</h4>
                        <label class="bonus-highlight flex items-center p-2 rounded-lg cursor-pointer" data-bonus="dobradinha" title="Adiciona R$ 50,00 ao total">
                            <input type="checkbox" class="bonus-dobradinha-checkbox h-5 w-5 text-orange-600 rounded focus:ring-orange-500 mr-2" disabled>
                            <span class="font-medium">Dobradinha (Dom. M+N)</span>
                        </label>
                    </div>

                    <div class="events-section bg-white rounded-lg p-3 border">
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="text-md font-semibold text-gray-700">Eventos / Adicionais</h4>
                            <button type="button" class="add-event-btn bg-blue-500 hover:bg-blue-600 text-white font-bold h-7 w-7 rounded-full flex items-center justify-center text-lg leading-none pb-1 flex-shrink-0" aria-label="Adicionar adicional">+</button>
                        </div>
                        <div class="event-list space-y-3"></div>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-t-2 border-dashed flex justify-between items-center">
                    <button type="button" class="generate-holerite-btn bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg text-sm transition-colors">Gerar Holerite</button>
                    <div class="text-right">
                        <span class="text-lg font-medium">Total Funcionário:</span>
                        <span class="employee-total text-2xl font-bold text-green-600 ml-2">R$ 0,00</span>
                    </div>
                </div>

                <details class="calculation-details mt-2 text-right">
                    <summary class="cursor-pointer text-sm text-blue-600 hover:underline inline-block">Ver Detalhes do Cálculo</summary>
                    <div class="details-content mt-2 p-3 bg-gray-100 rounded-md text-sm space-y-3 text-left">
                        <div class="shifts-breakdown-container hidden">
                            <h5 class="font-semibold text-gray-800">Turnos:</h5>
                            <ul class="shifts-breakdown-list list-disc list-inside text-gray-700 pl-2"></ul>
                        </div>
                        <div class="events-breakdown-container hidden">
                            <h5 class="font-semibold text-gray-800">Eventos/Adicionais:</h5>
                            <ul class="events-breakdown-list list-disc list-inside text-gray-700 pl-2"></ul>
                        </div>
                        <div class="bonus-breakdown-container hidden">
                            <h5 class="font-semibold text-gray-800">Bônus:</h5>
                            <ul class="bonus-breakdown-list list-disc list-inside text-gray-700 pl-2"></ul>
                        </div>
                    </div>
                </details>
            </div>
        </div>
    </template>

    <!-- Script Principal Modular (ES Module) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
